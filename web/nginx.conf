# Ce fichier est inclus au niveau `http` (voir Dockerfile).
# TLS est terminé en amont par Nginx Proxy Manager : ce conteneur ne voit que du http.
# On relaie donc le X-Forwarded-Proto reçu (https) et on ne retombe sur $scheme que
# lorsque personne ne l'a posé — sinon express-session refuse de poser le cookie
# `secure` en production et la connexion boucle indéfiniment.
#
# Ce relais suppose que seul NPM peut joindre ce conteneur : docker-compose.yml
# ne publie le port que sur 127.0.0.1 par défaut (WEB_BIND). Quiconque joint le
# port directement peut forger X-Forwarded-Proto et X-Forwarded-For — si WEB_BIND
# vise une adresse du réseau local, en restreindre l'accès à l'hôte de NPM
# (pare-feu). Seules les valeurs `http` et `https` sont relayées, toute autre
# valeur est remplacée par le schéma réel.
map $http_x_forwarded_proto $cave_fwd_proto {
  default $scheme;
  https   https;
  http    http;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 25m;
  server_tokens off;

  include /etc/nginx/snippets/securite.conf;

  location /api/ {
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $cave_fwd_proto;
    proxy_buffering off;   # SSE
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/securite.conf;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/securite.conf;
  }
}
