# En-têtes de sécurité, inclus dans le bloc `server` ET dans chaque `location`
# qui pose ses propres `add_header` : nginx n'hérite des `add_header` du niveau
# supérieur que si le niveau courant n'en déclare aucun.
#
# CSP : tout est servi par ce conteneur (y compris les photos et miniatures, via
# /api), sauf les polices Google — feuille de style sur fonts.googleapis.com,
# fichiers sur fonts.gstatic.com. La connexion Google est une simple navigation
# vers /api/auth/google, sans script ni cadre de Google dans la page.
# Les attributs `style` posés par React passent par le CSSOM et ne demandent pas
# 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Appareil photo pour la saisie des étiquettes ; le reste est fermé.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
