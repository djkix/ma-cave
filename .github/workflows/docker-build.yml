name: Build and publish images
on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
  workflow_call:
    inputs:
      tag: { description: "Version tag (e.g. v0.1.0)", required: true, type: string }

permissions: { contents: read, packages: write }

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # La référence fait partie du groupe, sinon la construction de l'image taguée
    # d'une publication et celle de `latest` sur main se disputent la même file :
    # un seul travail peut y attendre, et un troisième pousse le travail en
    # attente à l'annulation. C'est ce qui a laissé `ma-cave-web:1.1.0`
    # manquante à la publication de la 1.1.0, alors que l'api était déjà publiée.
    concurrency: { group: "docker-build-${{ matrix.image }}-${{ inputs.tag || github.ref }}", cancel-in-progress: false }
    strategy:
      matrix:
        include:
          - { image: api, context: ./api }
          - { image: web, context: ./web }
    steps:
      # L'étiquette reçue (workflow_call) ou poussée n'entre jamais telle quelle
      # dans un script : elle passe par l'environnement et doit être de la forme
      # vX.Y.Z, sans quoi la publication s'arrête avant même le checkout.
      - name: Valider l'étiquette de version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG";
          elif [ "$REF_TYPE" = "tag" ]; then TAG="$REF_NAME";
          else TAG=""; fi
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Étiquette de version invalide (attendu : vX.Y.Z)"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: "${{ inputs.tag || github.sha }}" }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG";
          elif [ "$REF_TYPE" = "tag" ]; then TAG="$REF_NAME";
          else TAG=""; fi
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          # Le libellé affiché dans l'application. Pour une image taguée c'est le
          # numéro de version publié ; pour une image `latest` construite depuis
          # main, ce numéro suivi de l'empreinte du commit — sinon l'application
          # annoncerait la dernière version publiée alors qu'elle fait tourner des
          # changements non publiés.
          if [ -n "$TAG" ]; then echo "display=${TAG#v}" >> "$GITHUB_OUTPUT";
          else echo "display=$(python3 -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ steps.version.outputs.value != '' }}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VITE_APP_VERSION=${{ steps.version.outputs.display }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
