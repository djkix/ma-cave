name: CI
on:
  push:
    branches: [main]
  pull_request:

# Le jeton n'a besoin que de lire le dépôt.
permissions: { contents: read }

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cave, POSTGRES_PASSWORD: cave, POSTGRES_DB: cave }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cave" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://cave:cave@localhost:5432/cave
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BREAK_GLASS_EMAIL: ci@example.com
      BREAK_GLASS_PASSWORD: ci-break-glass-password
      ADMIN_EMAILS: ci@example.com
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - run: npm run lint
      # Le lint ne type-checke pas : sans ceci, une erreur de type dans un point
      # d'entrée, un module ou un contrôleur ne serait vue qu'au build de l'image.
      - run: npx tsc --noEmit -p tsconfig.build.json
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Script de sauvegarde essayé dans son image, avec faux pg_dump et psql
  # (sauvegarde/essai.sh) : liens physiques, sept jours, verrou, échecs inscrits.
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t ma-cave-sauvegarde:essai sauvegarde
      - run: docker run --rm --entrypoint sh ma-cave-sauvegarde:essai /app/essai.sh

  # Dockge crée une stack à partir du seul docker-compose.yml et de son .env,
  # sans cloner le dépôt. Ce job reproduit exactement cette situation : si un
  # service dépend d'un fichier du dépôt monté depuis l'hôte, Docker monte un
  # dossier vide à la place et le service échoue en silence — c'est ainsi que
  # l'ancienne sauvegarde n'a jamais tourné en production, en redémarrant en
  # boucle avec le code 0. Le job exige donc une vraie sauvegarde sur le « NAS »
  # (un dossier local), inscrite en base, pas seulement un conteneur démarré.
  # Les images api et sauvegarde sont celles de ce commit, construites ici.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Images de ce commit
        run: |
          docker build -t ghcr.io/djkix/ma-cave-api:latest api
          docker build -t ghcr.io/djkix/ma-cave-sauvegarde:latest sauvegarde
      - name: Stack autonome — sauvegarde réelle sans aucun fichier du dépôt
        run: |
          stack="$RUNNER_TEMP/stack"
          mkdir -p "$stack/nas"
          cp docker-compose.yml "$stack/"
          cp .env.example "$stack/.env"
          cd "$stack"
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password/' .env
          sed -i 's/^SESSION_SECRET=.*/SESSION_SECRET=ci-secret-ci-secret-ci-secret-ci-secret/' .env
          sed -i 's/^SAUVEGARDE_HEURE=.*/SAUVEGARDE_HEURE=0/' .env
          printf 'NAS_TYPE=none\nNAS_OPTIONS=bind\nNAS_CHEMIN=%s/nas\n' "$stack" >> .env
          docker compose config -q
          docker compose up -d sauvegarde
          for i in $(seq 1 90); do
            test -f nas/derniere/sauvegarde.txt && break
            sleep 2
          done
          docker compose logs api sauvegarde
          ls -la nas/ nas/derniere/ nas/derniere/config/
          cat nas/derniere/sauvegarde.txt
          test -s nas/derniere/base/cave.dump
          test -f nas/derniere/config/docker-compose.yml
          test -f nas/derniere/config/.env
          for i in $(seq 1 10); do
            n=$(docker compose exec -T postgres psql -U cave -d cave -tAc 'SELECT count(*) FROM backup_run WHERE succeeded')
            [ "$n" = 1 ] && break
            sleep 2
          done
          test "$n" = 1
          # Toujours vivant après la sauvegarde : planifier.sh attend le passage suivant.
          test "$(docker compose ps sauvegarde --format '{{.State}}')" = running
          test "$(docker inspect --format '{{.RestartCount}}' "$(docker compose ps -q sauvegarde)")" = 0
      - if: always()
        run: cd "$RUNNER_TEMP/stack" && docker compose down -v
