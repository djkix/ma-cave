name: Release Please
on:
  push:
    branches: [main]
permissions: { contents: write, pull-requests: write }
jobs:
  release:
    runs-on: ubuntu-latest
    # Une seule exécution à la fois : le commit de résumé poussé juste après la
    # fusion d'une PR de version relançait release-please pendant qu'il publiait
    # encore, et la seconde exécution échouait en retirant l'étiquette
    # « autorelease: pending » déjà retirée (« Label does not exist »).
    concurrency: { group: release-please, cancel-in-progress: false }
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with: { config-file: release-please-config.json, manifest-file: .release-please-manifest.json }
  images:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    uses: ./.github/workflows/docker-build.yml
    with: { tag: "${{ needs.release.outputs.tag_name }}" }
    permissions: { contents: read, packages: write }
